[project]
name = "projet_prediction_stocks"
version = "0.1.0"
description = "Stock prediction project with LSTM"
authors = [{ name = "Ambroise012" }]
requires-python = ">=3.10,<4.0"
dependencies = [
	"requests>=2.32.3,<3.0.0",
	"yfinance>=0.2.44,<0.3.0",
	"numpy>=1.26.4,<2.0.0",
	"pandas>=2.2.3,<3.0.0",
	"matplotlib>=3.9.2,<4.0.0",
	"scikit-learn>=1.5.2,<2.0.0",
	"python-dotenv>=1.1.1,<2.0.0",
	"streamlit>=1.49.1,<2.0.0",
	"transformers>=4.46.3,<5.0.0",
	"torch>=2.14.1",
	"sentencepiece>=0.2.2",
]

[dependency-groups]
dev = [
	"pytest>=8.3.3,<9.0.0",
	"black>=24.8.0,<25.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
